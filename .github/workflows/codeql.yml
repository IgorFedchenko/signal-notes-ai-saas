name: CodeQL (public repositories only)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  eligibility:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CodeQL analysis runs only after owner-approved public visibility; private paid licensing is not enabled."
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
